<!DOCTYPE html>
<!-- saved from url=(0036)http://localhost/proyecto/index.html -->
<html lang="es"><head><meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
    
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mundial FIFA 2026</title>
    <link rel="stylesheet" href="./Mundial FIFA 2026_files/styles.css">
</head>
<body>

    <div class="container">
        <header class="main-header">
            <span class="badge">FIFA 2026</span>
            <h1>MUNDIAL</h1>
           
        </header>

        <hr class="section-divider">

        <section>
            <h2>Equipos</h2>
            <div class="teams-grid">
                <div class="team-card">Italia </div>
                <div class="team-card">Brasil </div>
                <div class="team-card">England</div>
                <div class="team-card">US</div>
                <div class="team-card">Argentina</div>
            </div>
        </section>

        <hr class="section-divider">

        <section>
            <h2>Jugadores Destacados</h2>
            <div class="players-grid">
                <div class="player-card">
                    <img src="./Mundial FIFA 2026_files/003.JPG" alt="Lionel Messi" style="width:35%;height: 160px;object-fit: cover;">
                    <h3>Lionel Messi</h3>
                </div>
                <div class="player-card">
                    <img src="./Mundial FIFA 2026_files/002.JPG" alt="Kylian Mbappé" style="width:35%;height: 160px;object-fit: cover;">
                    <h3>Kylian Mbappé</h3>
                </div>
                <div class="player-card">
                    <img src="./Mundial FIFA 2026_files/001.JPG" alt="Neymar jr" style="width:35%;height: 160px;object-fit: cover;">
                    <h3>Neymar jr</h3>
                </div>
            </div>
        </section>

        <hr class="section-divider">

        <section>
            <h2>Resultado del partido</h2>
            <div class="match-board">
                <h3>México Vs Brasil</h3>
                <div class="score">2 - 1</div>
                <div class="winner">Ganador: <span>Mexico</span></div>
            </div>
        </section>

        <hr class="section-divider">

        <section>
            <h2>Estadísticas del Mundial</h2>
            <div class="stats-grid">
                <div class="stat-box">
                    <div class="stat-number">69</div>
                    <div>Partidos</div>
                </div>
                <div class="stat-box">
                    <div class="stat-number">32</div>
                    <div>Equipos</div>
                </div>
                <div class="stat-box">
                    <div class="stat-number">120</div>
                    <div>Goles</div>
                </div>
            </div>
            <div class="champion-box">
                <p>CAMPEÓN ESPERANDO:</p>
                <div class="champion-team">MEXICO</div>
            </div>
        </section>
    </div>


</body></html>
