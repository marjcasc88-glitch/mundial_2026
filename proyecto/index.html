<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mundial FIFA 2026</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

    <div class="container">
        <header class="main-header">
            <span class="badge">FIFA 2026</span>
            <h1>MUNDIAL</h1>
           
        </header>

        <hr class="section-divider">

        <section>
            <h2>Equipos</h2>
            <div class="teams-grid">
                <div class="team-card">Italia </div>
                <div class="team-card">Brasil </div>
                <div class="team-card">England</div>
                <div class="team-card">US</div>
                <div class="team-card">Argentina</div>
            </div>
        </section>

        <hr class="section-divider">
<section>
    <h2>Jugadores Destacados</h2>
    
    <div class="d-flex flex-row justify-content-center gap-4">
        
        <div class="player-card card" style="width: 300px;">
            <img src="IMG/003.JPG" alt="Lionel Messi" style="height: 160px; object-fit: cover;">
            <h3>Lionel Messi</h3>
        </div>

        <div class="player-card card" style="width: 300px;">
            <img src="IMG/002.JPG" alt="Kylian Mbappé" style="height: 160px; object-fit: cover;">
            <h3>Kylian Mbappé</h3>
        </div>

        <div class="player-card card" style="width: 300px;">
            <img src="IMG/001.JPG" alt="Neymar jr" style="height: 160px; object-fit: cover;">
            <h3>Neymar jr</h3>
        </div>

    </div>
</section>
       
       

      
        <hr class="section-divider">

        <section>
            <h2>Resultado del partido</h2>
            <div class="match-board">
                <h3>México Vs Brasil</h3>
                <div class="score">2 - 1</div>
                <div class="winner">Ganador: <span>Mexico</span></div>
            </div>
        </section>

        <hr class="section-divider">

        <section>
            <h2>Estadísticas del Mundial</h2>
            <div class="stats-grid">
                <div class="stat-box">
                    <div class="stat-number">69</div>
                    <div>Partidos</div>
                </div>
                <div class="stat-box">
                    <div class="stat-number">32</div>
                    <div>Equipos</div>
                </div>
                <div class="stat-box">
                    <div class="stat-number">120</div>
                    <div>Goles</div>
                </div>
            </div>
            <div class="champion-box">
                <p>CAMPEÓN ESPERANDO:</p>
                <div class="champion-team">MEXICO</div>
            </div>
        </section>
    </div>

</body>
</html>
